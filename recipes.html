<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เมนูสุขภาพ | HealthyBite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="recipes" class="flex justify-center min-h-screen bg-gray-100 text-gray-800">

  <div class="w-full max-w-md bg-[#F8FAF8] min-h-screen shadow-2xl relative flex flex-col overflow-x-hidden pb-24">

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-30 px-5 py-3.5 flex items-center justify-between border-b border-gray-100">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-sm">
          <i data-lucide="leaf" class="w-5 h-5"></i>
        </div>
        <span class="font-bold text-lg text-gray-900 tracking-tight">Healthy<span class="text-emerald-600">Bite</span></span>
      </div>
      <div class="flex items-center gap-2.5">
        <span class="text-xs font-medium bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full border border-emerald-100">
          เป้าหมาย: <span id="header-target">1,800</span> kcal
        </span>
        <button onclick="switchTab('profile')" class="w-8 h-8 rounded-full overflow-hidden border border-emerald-200 shrink-0">
          <img id="header-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Avatar" class="w-full h-full object-cover">
        </button>
      </div>
    </header>

    <main class="flex-1 px-5 pt-4">
      <section id="page-recipes" class="page-section fade-in space-y-4">
        <div>
          <h1 class="text-xl font-bold text-gray-900">รายการอาหารเพื่อสุขภาพ</h1>
          <p class="text-xs text-gray-500">ค้นหาเมนู เลือกตามเป้าหมาย และตรวจดูสารอาหารก่อนเพิ่มลงบันทึกวันนี้</p>
        </div>

        <!-- Search Input -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5"></i>
          <input type="text" id="recipe-search" oninput="renderRecipes()" placeholder="ค้นหาชื่อเมนู เช่น แซลมอน, อกไก่..." class="w-full bg-white border border-gray-200 rounded-2xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Filter Pills -->
        <div id="category-pills" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>

        <!-- Recipe List -->
        <div id="recipes-container" class="space-y-4 pb-4"></div>
      </section>
    </main>

    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
      <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
      <span id="toast-msg">บันทึกสำเร็จ</span>
    </div>

    <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 px-2 py-2 flex justify-around items-center z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
      <button onclick="switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center justify-center w-16 py-1 text-emerald-600">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold mt-1">หน้าแรก</span>
      </button>

      <button onclick="switchTab('recipes')" data-tab="recipes" class="nav-btn flex flex-col items-center justify-center w-16 py-1 text-gray-400 hover:text-emerald-600">
        <i data-lucide="utensils" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">เมนูสุขภาพ</span>
      </button>

      <!-- Center Prominent Scan Button -->
      <button onclick="switchTab('scan')" data-tab="scan" class="nav-btn flex flex-col items-center justify-center -mt-6">
        <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center shadow-lg shadow-emerald-600/30 border-4 border-[#F8FAF8] active:scale-95 transition">
          <i data-lucide="scan-line" class="w-6 h-6"></i>
        </div>
        <span class="text-[10px] font-semibold text-gray-600 mt-1">สแกนอาหาร</span>
      </button>

      <button onclick="switchTab('planner')" data-tab="planner" class="nav-btn flex flex-col items-center justify-center w-16 py-1 text-gray-400 hover:text-emerald-600">
        <i data-lucide="calendar-check" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">ตารางมื้อ</span>
      </button>

      <button onclick="switchTab('profile')" data-tab="profile" class="nav-btn flex flex-col items-center justify-center w-16 py-1 text-gray-400 hover:text-emerald-600">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium mt-1">โปรไฟล์</span>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>
</html>
